# human-only-paths.conf —— 這個專案自己的 T3／T4 路徑（guard-git.sh 讀）。
#
# 為什麼有這份：合併閘按「路徑」判風險，不按任何人對 diff 的判斷
# （Ai-coding-principle/GRANULARITY.md、家規第 39 條）。守衛、技能、CLAUDE.md、
# schema、ADR、CI、家規與帳本這些每個專案都一樣的，已經寫死在 guard-git.sh；
# 這裡只放「這個專案弄錯了會壞使用者的資料、或牽涉安全」的地基路徑。
#
# 格式：
#   - 一行一個 glob，從 repo 根目錄算起。`*` 也吃斜線（`src/server/*` 涵蓋整棵子樹）。
#   - `#` 開頭是註解，空行略過；行尾的「 # 註解」也會略過。
#   - 這些寫法都會被正規化成同一條：`src/server`、`src/server/`、`./src/server/*`、
#     `"src/server/*"`、`src\server\*`（沒有萬用字元的樣式同時當檔名與目錄）。
#   - 只有註解或空白的 `check:` 當沒寫，用預設——不能讓退路一個檢查都沒跑就放行。
#   - `check:` 開頭的一行是 CI 停擺時，合併閘在本機重跑的檢查指令。
#     沒寫就用 guard-git.sh 寫死的預設：pnpm test && pnpm typecheck && pnpm lint。
#     這個專案是 Python／uv，那個預設在這裡必紅，所以下面的 check: 行不能刪。
#
# 這份檔在 .claude/hooks/ 底下，改它的 PR 本身就是 T3——規則不能自己放行自己的修改。
# 路徑還沒建立也可以先寫：用位置無關的樣式（`*/provenance/*`）先擋住，比漏掉便宜。
#
# 範例（`#ex ` 開頭的行不會生效；test-guard-git.sh 會拿它們來驗這份檔的格式。
# 要啟用就複製一行、拿掉 `#ex `）：
#ex src/server/*
#ex */provenance/*
#ex packages/contracts/*
#ex migrations/*

