{# 16px 線條圖示；路徑照 S0 設計稿。圖示只當裝飾（aria-hidden），意思一律由旁邊的文字講。 #}
{% macro icon(name) -%}
<svg viewBox="0 0 24 24" aria-hidden="true">
{%- if name == "queued" %}<path d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9"/>
{%- elif name == "running" or name == "clock" %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "review" %}<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
{%- elif name == "approved" %}<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>
{%- elif name == "discarded" %}<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>
{%- elif name == "gpu" %}<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>
{%- elif name == "rate" %}<path d="M12 3v6M8 7l4-4 4 4"/><path d="M4 21h16"/><path d="M6 17h12"/>
{%- elif name == "tool" %}<path d="M4 12h16M12 4a12 12 0 0 1 0 16M12 4a12 12 0 0 0 0 16"/><circle cx="12" cy="12" r="8"/>
{%- elif name == "warn" %}<path d="M12 3l9 16H3z"/><path d="M12 10v4"/><path d="M12 17h.01"/>
{%- elif name == "x" %}<path d="M6 6l12 12M18 6L6 18"/>
{%- elif name == "check" %}<path d="M5 12l5 5L20 7"/>
{%- elif name == "bang" %}<path d="M12 7v6"/><path d="M12 17h.01"/>
{%- elif name == "question" %}<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4"/><path d="M12 17h.01"/>
{%- elif name == "plus" %}<path d="M12 5v14M5 12h14"/>
{%- elif name == "pending" %}<circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/>
{%- elif name == "todo" %}<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>
{%- endif %}</svg>
{%- endmacro %}
