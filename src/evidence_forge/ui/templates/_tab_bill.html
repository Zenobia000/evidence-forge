<div class="s0-panel" style="padding: 8px 16px">
<div class="s0-tablewrap">
<table class="s0-table">
<thead><tr><th>段</th><th>模型</th><th>升級</th><th class="num">時間</th><th class="num">GPU 秒</th><th class="num">金額</th></tr></thead>
<tbody>
{% for r in view.bill_rows %}<tr><td>{{ r.label }}</td><td>{{ r.models }}</td><td>{{ r.escalation }}</td><td class="num">{{ r.elapsed }}</td><td class="num">{{ r.gpu_seconds }}</td><td class="num">{{ r.amount }}</td></tr>{% endfor %}
</tbody>
<tfoot><tr><td colspan="5">合計（預算 US${{ view.bill_budget }}）</td><td class="num">{{ view.bill_total }}</td></tr></tfoot>
</table>
</div>
</div>
