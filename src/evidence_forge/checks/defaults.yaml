# 自動檢查的預設設定。創作者要改，寫在 $EF_DATA/checks.yaml，只寫要改的那幾項，例：
#   c3:
#     max_ngram_overlap: 0
#
# C3 逐字重疊的提醒門檻（ADR-0020 §3.4）：重構文章跟原文、跟每一份來源各算一次，
# 超過只標 warn 給創作者看，不擋。Q-28 還沒定，下面是暫定值。
# 詞的算法：中日韓文一個字一個詞，英文一個字一個詞。
c3:
  # 連續 8 個詞算一組 n-gram：中文約一個短句、英文約半句。短於這個長度的相同片語
  # （人名、術語、常見說法）不算照抄。
  ngram_size: 8
  # 文章的 8-gram 超過一成出現在某一份來源就提醒。正常改寫遠低於這個數；
  # 一篇 15 段的文章抄兩段就會超過。
  max_ngram_overlap: 0.10
  # 一字不差的一段最多 30 個詞：容得下逐字引用原作者的一句話，
  # 容不下整段（一段通常 60～150 個詞）。
  max_common_tokens: 30
  provisional: true
