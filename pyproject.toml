[project]
name = "evidence-forge"
version = "0.0.0"
description = ""
# 版本由 .python-version 釘住（uv 讀它）；這裡只寫允許的範圍。
requires-python = ">=3.12,<3.14"
# 執行期相依等第一個真的模組需要時才加，不先佔位。
# pydantic：資料夾契約的模型（S0.2）；pyyaml：job.md 與配方的 frontmatter；
# jsonschema：C5 用 skill 的 schema.json 驗證產出（S0.7）。
# fastapi、jinja2：簡易 UI（S0.11）；markdown-it-py：把稿子的 Markdown 轉成 HTML（不放行原始 HTML）。
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "markdown-it-py>=4.2.0",
    "pydantic>=2.14.0",
    "pypdf>=6.20.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

# `ef new`、`ef serve`（S0.3）
[project.scripts]
ef = "evidence_forge.cli:main"

# uv sync 預設會裝 dev 群組；CI 與本機檢查用同一組。
[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20260906",
    "types-jsonschema>=4.26.0.20261006",
    # FastAPI 的 TestClient 靠它（Starlette 1.x 改要 httpx2）；只在測試用。
    "httpx2>=2.13.1",
]

# uv_build 預設找 src/<套件名>/，也就是 src/evidence_forge/。
[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

# 單元、功能、契約測試都在這裡跑。瀏覽器的整合測試（e2e）如果有，走另一套工具，不歸 pytest。
[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers：標記打錯字直接失敗，不會默默變成一個沒人認得的新標記。
addopts = ["--import-mode=importlib", "--strict-markers"]
# 測試共用的小工具（tests/ui_folder.py）直接用檔名 import。
pythonpath = ["tests"]
markers = [
    "promise(id): 這條測試證明的承諾 ID（PRD v2.0，例：NFR-KEEP-01），可以重複標多個",
    "pipeline: 真的 Pi＋ef-tools＋閘道重播的整條流程（要用 harness/pi/ 鎖定的 Pi）",
]

# 型別錯誤在這裡擋，不留到執行時才炸。涵蓋 src/ 與 tests/。
[tool.mypy]
files = ["src", "tests"]
# tests/ 也列進來，並依目錄算模組名：tests/conftest.py 與 tests/integration/conftest.py 才不會撞名。
mypy_path = ["src", "tests"]
explicit_package_bases = true
strict = true
# pydantic 的外掛讓 mypy 看得懂模型的建構子參數與驗證器。
plugins = ["pydantic.mypy"]

# Lint 只擋會出錯的寫法（沒用到的變數、可變的預設參數之類）；排版與命名風格不在這裡爭
# （`.claude/skills/PIPELINE.md`〈審查與合併〉）。專案自己的規則加在 select 後面，每條附一句「它擋的是什麼」。
[tool.ruff]
target-version = "py312"
extend-exclude = ["docs", ".claude", "Ai-coding-principle"]

[tool.ruff.lint]
# E4/E7/E9/F 是 ruff 預設；B（bugbear）擋常見的邏輯陷阱。
select = ["E4", "E7", "E9", "F", "B"]
